# 푸시하면 화면을 Firebase Hosting 에 올린다.
#
# 예전에는 FirebaseExtended/action-hosting-deploy@v0 를 썼는데 10/22 부터 계속 실패했다.
# 그 액션은 손이 끊긴 지 오래고, 안에서 firebase-tools 를 **늘 최신으로** 받아 쓰는 탓에
# 어느 날 새 판이 나오면 우리가 아무것도 안 건드려도 깨진다. 게다가 실패해도
# 'npx 종료 코드 1' 한 줄만 남겨 무엇이 잘못됐는지 알 수가 없었다.
#
# 그래서 공식 도구를 **판을 박아** 직접 부른다. PC 에서 손으로 올릴 때와 똑같은 명령이라,
# 한쪽이 되는데 다른 쪽이 안 되는 일이 없다.
name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - master
  workflow_dispatch:        # 고치지 않고도 손으로 다시 돌려 볼 수 있게

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 깔기
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 열쇠를 파일로 풀어 둔다. echo 로 넘기면 JSON 안의 따옴표가 셸에 먹히므로
      # 반드시 환경변수를 거쳐 printf 로 적는다.
      - name: 서비스 계정 열쇠 풀기
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MINIX_SALEMARKETING }}
        run: |
          if [ -z "$SA_JSON" ]; then
            echo "::error::비밀값 FIREBASE_SERVICE_ACCOUNT_MINIX_SALEMARKETING 가 비어 있습니다."
            echo "::error::GitHub → Settings → Secrets and variables → Actions 에서 서비스 계정 JSON 을 다시 넣어 주세요."
            exit 1
          fi
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          node -e "JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/sa.json','utf8'))" \
            || { echo "::error::열쇠가 올바른 JSON 이 아닙니다 — 파일 내용을 통째로 붙여 넣었는지 확인해 주세요."; exit 1; }

      - name: 올리기
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: >
          npx --yes firebase-tools@15.22.3 deploy
          --only hosting
          --project minix-salemarketing
          --non-interactive
